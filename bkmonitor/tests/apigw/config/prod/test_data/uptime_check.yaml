# 生产环境 - 拨测模块测试数据
# 仅包含【环境相关】的配置，固定测试参数直接在测试代码中定义

# =============================================================================
# 节点配置（环境相关）
# =============================================================================
node:
  bk_host_id: 0        # TODO: 填写生产环境的 bk_host_id
  ip: 127.0.0.1        # TODO: 填写生产环境的节点 IP
  bk_cloud_id: 0

# =============================================================================
# CMDB 动态拓扑目标配置（环境相关）
# =============================================================================
cmdb_target:
  tcp:
    node_list:
      - bk_obj_id: "module"
        bk_inst_id: 0  # TODO: 填写生产环境的 module inst_id
    port: 22
  udp:
    node_list:
      - bk_obj_id: "set"
        bk_inst_id: 0  # TODO: 填写生产环境的 set inst_id
    port: 53
  icmp:
    node_list:
      - bk_host_id: 0  # TODO: 填写生产环境的 bk_host_id
